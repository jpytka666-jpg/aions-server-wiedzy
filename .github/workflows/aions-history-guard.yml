name: AIONS history guard
on:
  push:
  pull_request:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python aions_core/tools/aions_preflight.py --validate
      - run: python -m unittest aions_core.tests.test_history_guard -v
      - run: |
          set +e
          python aions_core/tools/aions_preflight.py --claim-new R2_opakowanie_syntezy
          code=$?
          test "$code" -eq 12
