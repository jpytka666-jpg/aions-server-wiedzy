name: AIONS history guard
on:
  push:
    paths:
      - "AIONS_CATALOG/architecture_history.json"
      - "aions_core/server/history_guard.py"
      - "aions_core/server/pocket_qc.py"
      - "aions_core/tools/aions_preflight.py"
      - "aions_core/tests/test_history_guard.py"
      - "AGENTS.md"
  pull_request:
    paths:
      - "AIONS_CATALOG/architecture_history.json"
      - "aions_core/server/history_guard.py"
      - "aions_core/server/pocket_qc.py"
      - "aions_core/tools/aions_preflight.py"
      - "aions_core/tests/test_history_guard.py"
      - "AGENTS.md"
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python aions_core/tools/aions_preflight.py --validate
      - run: python -m unittest aions_core.tests.test_history_guard -v
      - run: |
          set +e
          python aions_core/tools/aions_preflight.py --claim-new R2_opakowanie_syntezy
          code=$?
          test "$code" -eq 12
